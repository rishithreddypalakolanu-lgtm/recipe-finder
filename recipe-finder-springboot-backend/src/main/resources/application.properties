spring.application.name=recipe-finder-backend
server.port=8080

# MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/recipe_finder?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

